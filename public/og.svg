<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset="1" stop-color="#ebe3d3"/>
    </linearGradient>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7359"/>
      <stop offset="1" stop-color="#2b4535"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0e5e6"/>
      <stop offset="1" stop-color="#a8b1b5"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cf7852"/>
      <stop offset="1" stop-color="#96462f"/>
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddba8d"/>
      <stop offset="1" stop-color="#a97f54"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="0%" r="75%">
      <stop offset="0" stop-color="#b9f34f" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b9f34f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1f2119" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="grain" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.6" fill="#1f2119" opacity="0.05"/>
      <circle cx="5" cy="6" r="0.5" fill="#1f2119" opacity="0.04"/>
      <circle cx="3" cy="4" r="0.4" fill="#ffffff" opacity="0.18"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2a2418" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#grain)"/>

  <!-- header -->
  <g font-family="'DejaVu Sans Mono', monospace">
    <rect x="72" y="52" width="112" height="38" rx="5" fill="#f8f4ea" stroke="#b9b09f" stroke-width="1.2"/>
    <text x="84" y="78" font-size="20" font-weight="700" fill="#1f2119" letter-spacing="-1">native</text>
    <text x="160" y="78" font-size="20" font-weight="700" fill="#3f6b4f">/</text>
    <rect x="172" y="61" width="7" height="18" fill="#b9f34f"/>
    <text x="1128" y="77" font-size="12" fill="#6b6a5f" text-anchor="end" letter-spacing="2">КАРТОТЕКА ЗНАНИЙ · 2026</text>
  </g>

  <!-- title -->
  <g font-family="'DejaVu Serif', Georgia, serif" fill="#1f2119">
    <text x="70" y="232" font-size="70" letter-spacing="-3">Знание не в ленте.</text>
    <rect x="70" y="264" width="464" height="82" fill="#b9f34f"/>
    <text x="70" y="330" font-size="70" letter-spacing="-3" fill="#1f2119">Оно в картотеке.</text>
  </g>

  <g font-family="'DejaVu Sans', sans-serif" fill="#44443b">
    <text x="74" y="406" font-size="22">Девять концептов, четыре направления.</text>
    <text x="74" y="438" font-size="22">Связи, маршруты и атлас вместо ленты.</text>
  </g>

  <g font-family="'DejaVu Sans Mono', monospace" fill="#6b6a5f" font-size="13" letter-spacing="1.5">
    <text x="74" y="510">09 КОНЦЕПТОВ</text>
    <text x="238" y="510">04 НАПРАВЛЕНИЯ</text>
    <text x="432" y="510">25 СВЯЗЕЙ</text>
    <text x="566" y="510">03 МАРШРУТА</text>
  </g>

  <!-- material cards -->
  <g filter="url(#shadow)">
    <!-- context -->
    <g transform="translate(748 142)">
      <rect width="190" height="164" rx="10" fill="#f8f4ea" stroke="#b9b09f" stroke-width="1.2"/>
      <rect x="7" y="7" width="176" height="102" rx="6" fill="url(#felt)"/>
      <text x="156" y="96" font-family="'DejaVu Sans', sans-serif" font-size="52" font-weight="700" fill="#ffffff" opacity="0.2" text-anchor="end">01</text>
      <text x="16" y="38" font-family="'DejaVu Sans Mono', monospace" font-size="9" fill="#ffffff" opacity="0.75" letter-spacing="2">ФЕТР / 01</text>
      <text x="16" y="137" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1f2119">Контекст</text>
      <text x="16" y="153" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#6b6a5f" letter-spacing="1">БЮДЖЕТ ВНИМАНИЯ</text>
    </g>

    <!-- agents -->
    <g transform="translate(958 142)">
      <rect width="190" height="164" rx="10" fill="#f8f4ea" stroke="#b9b09f" stroke-width="1.2"/>
      <rect x="7" y="7" width="176" height="102" rx="6" fill="url(#steel)"/>
      <text x="156" y="96" font-family="'DejaVu Sans', sans-serif" font-size="52" font-weight="700" fill="#1f2119" opacity="0.13" text-anchor="end">02</text>
      <text x="16" y="38" font-family="'DejaVu Sans Mono', monospace" font-size="9" fill="#1f2119" opacity="0.55" letter-spacing="2">СТАЛЬ / 02</text>
      <text x="16" y="137" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1f2119">Агенты</text>
      <text x="16" y="153" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#6b6a5f" letter-spacing="1">КОНТРАКТЫ И ГРАНИЦЫ</text>
    </g>

    <!-- tools -->
    <g transform="translate(748 322)">
      <rect width="190" height="164" rx="10" fill="#f8f4ea" stroke="#b9b09f" stroke-width="1.2"/>
      <rect x="7" y="7" width="176" height="102" rx="6" fill="url(#rubber)"/>
      <text x="156" y="96" font-family="'DejaVu Sans', sans-serif" font-size="52" font-weight="700" fill="#ffffff" opacity="0.2" text-anchor="end">03</text>
      <text x="16" y="38" font-family="'DejaVu Sans Mono', monospace" font-size="9" fill="#ffffff" opacity="0.78" letter-spacing="2">РЕЗИНА / 03</text>
      <text x="16" y="137" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1f2119">Инструменты</text>
      <text x="16" y="153" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#6b6a5f" letter-spacing="1">MCP · ПОИСК · МОДЕЛИ</text>
    </g>

    <!-- practice -->
    <g transform="translate(958 322)">
      <rect width="190" height="164" rx="10" fill="#f8f4ea" stroke="#b9b09f" stroke-width="1.2"/>
      <rect x="7" y="7" width="176" height="102" rx="6" fill="url(#kraft)"/>
      <text x="156" y="96" font-family="'DejaVu Sans', sans-serif" font-size="52" font-weight="700" fill="#ffffff" opacity="0.2" text-anchor="end">04</text>
      <text x="16" y="38" font-family="'DejaVu Sans Mono', monospace" font-size="9" fill="#ffffff" opacity="0.8" letter-spacing="2">КРАФТ / 04</text>
      <text x="16" y="137" font-family="'DejaVu Sans', sans-serif" font-size="17" font-weight="700" fill="#1f2119">Практика</text>
      <text x="16" y="153" font-family="'DejaVu Sans Mono', monospace" font-size="8" fill="#6b6a5f" letter-spacing="1">ПРИЁМЫ И ЧЕК-ЛИСТЫ</text>
    </g>
  </g>

  <!-- footer -->
  <line x1="72" y1="570" x2="1128" y2="570" stroke="#b9b09f" stroke-width="1"/>
  <g font-family="'DejaVu Sans Mono', monospace" fill="#6b6a5f" font-size="12" letter-spacing="1">
    <text x="72" y="600">jefo.github.io</text>
    <text x="1128" y="600" text-anchor="end">КАТАЛОГ · МАРШРУТЫ · АТЛАС · СЛОВАРЬ</text>
  </g>
</svg>
